<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aktien & Watchlist</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 70px;
        }
        header {
            padding: 20px 16px 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            font-size: 24px;
            margin: 0;
            font-weight: 700;
        }
        .sort-indicator {
            color: #00e676;
            font-size: 14px;
            font-weight: 600;
        }
        .list-container {
            padding: 0 16px;
        }
        .aktie-item {
            padding: 14px 0;
            border-bottom: 1px solid #1e1e1e;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .aktie-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .aktie-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .aktie-logo {
            width: 36px;
            height: 36px;
            background-color: #2c2c2c;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: #fff;
        }
        .aktie-name {
            font-size: 16px;
            font-weight: 500;
        }
        .aktie-kurs {
            font-size: 16px;
            font-weight: 600;
            text-align: right;
        }
        .aktie-details {
            display: flex;
            gap: 12px;
            font-size: 12px;
            color: #888;
            padding-left: 48px;
        }
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #181818;
            border-top: 1px solid #282828;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }
        .nav-button {
            background: none;
            border: none;
            color: #888;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            gap: 4px;
        }
        .nav-button.active {
            color: #ffffff;
        }
        .nav-button svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="page-title">Watchlist</h1>
        <div class="sort-indicator">↓ Kurs</div>
    </header>

    <div class="list-container" id="aktien-liste">
        <p style="color: #888; text-align: center; margin-top: 40px;">Lade Daten...</p>
    </div>

    <nav>
        <button class="nav-button active" id="btn-watchlist" onclick="zeigeAnsicht('watchlist')">
            <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
            Watchlist
        </button>
        <button class="nav-button" id="btn-depot" onclick="zeigeAnsicht('depot')">
            <svg viewBox="0 0 24 24"><path d="M12 3L2 12h3v8h14v-8h3L12 3z"/></svg>
            Depot
        </button>
    </nav>

    <script>
        let alleDaten = [];
        let aktuelleAnsicht = 'watchlist';

        async function ladeDaten() {
            try {
                const response = await fetch('daten.json');
                if (response.ok) {
                    alleDaten = await response.json();
                }
            } catch (error) {
                console.log("Fehler beim Laden der daten.json");
            }
            rendereListe();
        }

        function zeigeAnsicht(ansicht) {
            aktuelleAnsicht = ansicht;
            document.getElementById('page-title').innerText = ansicht === 'watchlist' ? 'Watchlist' : 'Depot';
            document.getElementById('btn-watchlist').classList.toggle('active', ansicht === 'watchlist');
            document.getElementById('btn-depot').classList.toggle('active', ansicht === 'depot');
            rendereListe();
        }

        function rendereListe() {
            const container = document.getElementById('aktien-liste');
            container.innerHTML = '';

            const gefiltert = alleDaten.filter(item => {
                if (aktuelleAnsicht === 'watchlist') {
                    return item.watchlist === true;
                } else {
                    return item.watchlist !== true;
                }
            });

            if (gefiltert.length === 0) {
                container.innerHTML = '<p style="text-align:center; color: #777; margin-top: 40px;">Keine Einträge in dieser Ansicht.</p>';
                return;
            }

            gefiltert.forEach(aktie => {
                const initialen = aktie.name ? aktie.name.substring(0, 2).toUpperCase() : 'US';
                const kursVal = aktie.kurs || 0;
                const kursStr = kursVal.toFixed(2).replace('.', ',');
                const kursteile = kursStr.split(',');
                const ganzerKurs = kursteile[0];
                const centKurs = kursteile[1] || '00';

                const kgvText = aktie.kgv ? `KGV: ${aktie.kgv.toFixed(1)}` : 'KGV: -';
                const divText = aktie.dividendenrendite ? `Div: ${aktie.dividendenrendite.toFixed(1)}%` : 'Div: -';
                const exText = aktie.exDividendDate && aktie.exDividendDate !== '-' ? `Ex: ${aktie.exDividendDate}` : '';
                const payText = aktie.payoutDate && aktie.payoutDate !== '-' ? `Pay: ${aktie.payoutDate}` : '';

                const html = `
                    <div class="aktie-item">
                        <div class="aktie-main">
                            <div class="aktie-info">
                                <div class="aktie-logo">${initialen}</div>
                                <div class="aktie-name">${aktie.name}</div>
                            </div>
                            <div class="aktie-kurs">
                                ${ganzerKurs}<span style="font-size: 0.75em; vertical-align: super; color: #aaa;">${centKurs}</span>
                            </div>
                        </div>
                        <div class="aktie-details">
                            <span>${kgvText}</span>
                            <span>${divText}</span>
                            ${exText ? `<span>${exText}</span>` : ''}
                            ${payText ? `<span>${payText}</span>` : ''}
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        ladeDaten();
    </script>
</body>
</html>
